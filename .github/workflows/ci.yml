name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend Setup
      - name: Set up Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # Frontend Setup
      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "./front/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./front
        run: npm ci

      - name: Build frontend
        working-directory: ./front
        run: npm run build

      # Docker Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Backend Image
      - name: Build and Push Backend Image
        working-directory: ./backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ecom-backend:${IMAGE_TAG} .
          docker push ${{ secrets.DOCKER_USERNAME }}/ecom-backend:${IMAGE_TAG}

      # Build Frontend Image
      - name: Build and Push Frontend Image
        working-directory: ./front
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ecom-frontend:${IMAGE_TAG} .
          docker push ${{ secrets.DOCKER_USERNAME }}/ecom-frontend:${IMAGE_TAG}

      # Trigger CD
      - name: Trigger Deployment Workflow
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd.yml',
              ref: 'main',
              inputs: {
                image_tag: '${{ github.sha }}'
              }
            })