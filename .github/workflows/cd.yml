name: Deploy Monolithic E-Commerce to AWS EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: SSH into EC2 and deploy Docker images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Log in to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            # Pull the built images for this commit
            docker pull ${{ secrets.DOCKER_USERNAME }}/ecom-backend:${{ github.sha }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/ecom-frontend:${{ github.sha }}
            # Deploy with Docker Compose (compose file should reference the images)
            cd ~/app
            docker compose up -d
            docker image prune -f
